name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    name: Compile Examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [esp32:esp32:esp32, esp8266:esp8266:nodemcuv2]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.0.4
      - name: Install ESP32 core
        if: contains(matrix.board, 'esp32')
        run: |
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.0.0
      - name: Install ESP8266 core
        if: contains(matrix.board, 'esp8266')
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core install esp8266:esp8266@3.1.2
      - name: Compile examples
        run: |
          for dir in examples/*/; do
            echo "Compiling $dir"
            arduino-cli compile --fqbn ${{ matrix.board }} "$dir" || exit 1
          done

  lint:
    name: Arduino Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Arduino Lint
        uses: arduino/arduino-lint-action@v1
        with:
          library-manager: update

  host-tests:
    name: Host Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: python tests/host/test_aaruesp.py

  registry-validation:
    name: Registry Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry
        run: python tools/validate_registry.py